<!DOCTYPE html>
<html lang="en">
<head>
	<title>Bootstrap Jumbotron</title>
	
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link rel="stylesheet" href=
"https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
	
	<script src=
"https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
	</script>
</head>
<body style="text-align:center;">
   <div class="jumbotron jumbotron-fluid">
    <div class="conatiner">
    <h1 style="color: orangered;">
        Techycrew
    </h1>
<p>Techy Plays infiltrates a 2v2 match in Blue Lock Rivals, attempting to fool friends by posing as a static NPC
goalkeeper. The experiment leads to confusion and suspicion among participants as they question the goalkeeper's unusual
skills and movements.
</p>
    </div>
   </div> 
   
    <div class="conatiner mt-3"></div>
     <h2>buttons</h2>
    <button type="button" class="btn btn-primary">primary</button>
    <button type="button" class="btn btn-secondary">secondary</button>
    <button type="button" class="btn btn-warning">warning</button>
    <button type="button" class="btn btn-danger">danger</button>
    <button type="button" class="btn btn-sucess">sucess</button>
</body>
</html>
